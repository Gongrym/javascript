<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>변수 3</title>
  </head>
  <body>
    <script>
      // 1. banana 변수선언하고 금액을 할당하세요.
      let banana = 5000;
      // 2. apple 변수선언하고 금액을 할당하세요.
      let apple = 3000;
      // 3. mango 변수선언하고 금액을 할당하세요.
      let mango = 5000;
      // 4.  total변수 선언하고 banana apple mango 다 더한 식을 할당하세요
      let total = banana + apple + mango;
      // 화면에 바나나 사과 망고를 다 더한 금액은 ... 입니다.
      document.write(
        `<p> 바나나 사과 망고를 다 더 한 금액은 ${total} 입니다.</P>`,
      );
    </script>
  </body>
</html>
